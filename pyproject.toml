[project]
name = "vfold"
version = "0.1.0"
description = "VFold: cross-layer value cache compression"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "scipy",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# The repo root is the package `vfold`, so code can import
# `vfold.<module>` from anywhere after `pip install -e .`.
[tool.setuptools]
package-dir = {"vfold" = "."}
packages = [
    "vfold",
    "vfold.attn_head_align",
]
